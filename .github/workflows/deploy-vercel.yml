name: Vercel Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wot-pay-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_FORCE_NO_GIT: "1"

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          : "${VERCEL_TOKEN:?Add VERCEL_TOKEN as a repository secret}"
          : "${VERCEL_ORG_ID:?Add VERCEL_ORG_ID as a repository secret}"
          : "${VERCEL_PROJECT_ID:?Add VERCEL_PROJECT_ID as a repository secret}"
          npx --no-install vercel deploy --prod --yes --token="$VERCEL_TOKEN"
